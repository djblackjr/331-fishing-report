name: Daily Conditions Refresh

"on":
  schedule:
    # 08:13 UTC = ~3:13 AM Central. This is the sole automatic trigger now.
    # An external cron-job.org ping used to hit workflow_dispatch directly
    # as the "real" primary schedule, on the theory that GitHub's own cron
    # was unreliable — but a run-history check on 2026-10-20 showed the
    # opposite: cron-job.org fired reliably every day until ~Oct 8, then
    # stopped entirely (last workflow_dispatch-triggered run: Oct 8 02:07
    # UTC), while this native schedule has fired every single day since,
    # just landing ~4-10h late (seen between 12:00-17:48 UTC) rather than
    # at 08:13 UTC. Given that, the external ping was dropped rather than
    # debugged (it's a third-party dashboard with no API access from here)
    # — one dependency fewer, and the data still refreshes daily even if
    # later than ideal. If cron-job.org's job still exists, it's safe to
    # delete; it isn't doing anything.
    - cron: '13 8 * * *'
  workflow_dispatch:
    inputs:
      force_bite_report:
        description: Refresh the paid bite report even if it already ran today
        type: boolean
        default: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fetch live conditions and update conditions.json
        run: node scripts/update-conditions.mjs

      - name: Refresh local bite report
        id: bite_report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BITE_REPORT_FORCE: ${{ inputs.force_bite_report && '1' || '' }}
        run: node scripts/update-bite-report.mjs

      # Per-location "Today's advice" and the bay-wide daily summary used to
      # be a second Claude call here (update-location-notes.mjs), but that
      # script only ever synthesized text from data already in
      # conditions.json — no web search, nothing Claude could see that the
      # page itself can't. That's now computed client-side in App.jsx
      # (getTodaysCall/getDailySummary) at zero cost, so there's nothing
      # left for this workflow to run for it.

      - name: Rebuild sourced Atlas fishing intelligence
        run: npm run atlas:intelligence

      - name: Commit and push if changed
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-refresh fishing conditions"
          file_pattern: src/data/conditions.json public/atlas/intelligence.json

      - name: Trigger Pages deploy
        # A push made using the workflow's built-in token does NOT trigger
        # other workflows' `on: push` rules (GitHub blocks this to prevent
        # trigger loops), so daily-refresh's commit never kicks off
        # deploy-pages.yml by itself. Dispatching it explicitly is allowed
        # with the built-in token (needs `actions: write` above). This used
        # to use a personal access token stored as DEPLOY_TOKEN, which
        # expired, and the curl call hid the resulting 401 behind a green
        # step, so refreshed data stopped reaching the live site.
        if: steps.commit.outputs.changes_detected == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Fail run if the bite-report refresh failed
        # update-bite-report.mjs exits 0 on its own failures on purpose (a
        # bad Claude API call — missing key, billing, rate limit, malformed
        # response — shouldn't block the free weather/tide refresh above,
        # which already committed and deployed by this point). But that
        # used to mean a stuck Anthropic API key could silently no-op for
        # weeks while every run still showed green. This step runs last and
        # fails the job (red X, and a notification via GitHub's normal
        # failed-workflow alerts) whenever the script reported trouble, so
        # it can't go unnoticed again.
        if: always() && steps.bite_report.outputs.failed == 'true'
        run: |
          {
            echo "## ⚠️ Bite report refresh failed"
            echo
            echo "**What's Being Caught** did not refresh — see the 'Refresh local bite report' step's error annotation above."
            echo
            echo "Weather, tide, and forecast data above still refreshed normally — only the bite report is stale. Check the ANTHROPIC_API_KEY secret and the Anthropic account's billing/credit balance."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
