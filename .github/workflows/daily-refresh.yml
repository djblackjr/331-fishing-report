name: Daily Conditions Refresh

"on":
  schedule:
    # 08:13 UTC = ~3:13 AM Central. Kept as a fallback trigger, though the
    # real reliable schedule is now the external cron-job.org ping hitting
    # workflow_dispatch directly (GitHub's native schedule proved unreliable
    # for this repo — see project history).
    - cron: '13 8 * * *'
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Fetch live conditions and update conditions.json
        run: node scripts/update-conditions.mjs

      - name: Refresh local bite report
        id: bite_report
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-bite-report.mjs

      - name: Refresh AI summary and per-location notes
        id: location_notes
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/update-location-notes.mjs

      - name: Rebuild sourced Atlas fishing intelligence
        run: npm run atlas:intelligence

      - name: Commit and push if changed
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-refresh fishing conditions"
          file_pattern: src/data/conditions.json public/atlas/intelligence.json

      - name: Trigger Pages deploy
        # A push made using the workflow's default built-in token does NOT
        # trigger other workflows' `on: push` rules (GitHub blocks this
        # specifically to prevent infinite trigger loops). That silently
        # broke the deploy step, since daily-refresh's commit never kicked
        # off deploy-pages.yml. Using a real Personal Access Token here
        # (stored as the DEPLOY_TOKEN secret) doesn't have that restriction.
        if: steps.commit.outputs.changes_detected == 'true'
        run: |
          curl -X POST \
            -H "Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/djblackjr/331-fishing-report/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}'

      - name: Fail run if an AI-powered refresh step failed
        # The bite-report and location-notes scripts exit 0 on their own
        # failures on purpose (a bad Claude API call — missing key, billing,
        # rate limit, malformed response — shouldn't block the free
        # weather/tide refresh above, which already committed and deployed
        # by this point). But that used to mean a stuck Anthropic API key
        # could silently no-op for weeks while every run still showed
        # green. This step runs last and fails the job (red X, and a
        # notification via GitHub's normal failed-workflow alerts) whenever
        # either script reported trouble, so it can't go unnoticed again.
        if: always() && (steps.bite_report.outputs.failed == 'true' || steps.location_notes.outputs.failed == 'true')
        run: |
          {
            echo "## ⚠️ AI-powered refresh failed"
            echo
            [ "${{ steps.bite_report.outputs.failed }}" = "true" ] && echo "- **What's Being Caught** bite report did not refresh — see the 'Refresh local bite report' step's error annotation above."
            [ "${{ steps.location_notes.outputs.failed }}" = "true" ] && echo "- **AI summary / per-location notes** did not refresh — see the 'Refresh AI summary and per-location notes' step's error annotation above."
            echo
            echo "Weather, tide, and forecast data above still refreshed normally — only the Claude-powered copy is stale. Check the ANTHROPIC_API_KEY secret and the Anthropic account's billing/credit balance."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
